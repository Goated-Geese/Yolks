# Build and push the dotnet_10 yolk to GitHub Container Registry (GHCR).
# Image: ghcr.io/goated-geese/yolks:dotnet_10
# Requires: repo Settings -> Actions -> General -> Workflow permissions -> Read and write
# (so GITHUB_TOKEN can write packages).

name: Publish dotnet_10 yolk

on:
  push:
    branches: [main]
    paths:
      - "dotnet/10/**"
      - ".github/workflows/dotnet-10.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-yolks-dotnet-10
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dotnet/10
          file: ./dotnet/10/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/goated-geese/yolks:dotnet_10
